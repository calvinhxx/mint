name: Native build

on:
  workflow_call:
    inputs:
      tier:
        description: Build-matrix tier to run
        required: true
        type: string
      packages:
        description: Build, verify, and upload Release archives
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-plan:
    name: Select ${{ inputs.tier }} matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Select build matrix
        id: matrix
        shell: bash
        env:
          MINT_BUILD_TIER: ${{ inputs.tier }}
        run: |
          set -euo pipefail
          matrix="$(python3 .github/scripts/select-build-matrix.py --tier "$MINT_BUILD_TIER")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  native-build:
    name: ${{ matrix.name }}
    needs: build-plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-plan.outputs.matrix) }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up native build
        uses: ./.github/actions/setup-native
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          runner-arch: ${{ matrix.runner_arch }}
          system-packages: ${{ join(matrix.system_packages, ' ') }}

      - name: Configure tests
        run: cmake --preset dev -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build tests
        run: cmake --build --preset dev --parallel ${{ matrix.build_jobs }}

      - name: Test
        run: ctest --preset dev --parallel ${{ matrix.build_jobs }}

      - name: Check formatting
        if: matrix.id == 'linux-x64'
        run: cmake --build --preset dev --target format-check --parallel ${{ matrix.build_jobs }}

      - name: Set up Python for Qt
        if: inputs.tier == 'fast' && matrix.id == 'linux-x64'
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'

      # EN: Pin the executable action; its wrapper dispatches through a moving v4 tag.
      # ZH-CN: 固定实际安装入口；上游包装层通过会移动的 v4 标签转发。
      - name: Install Qt for desktop tests
        if: inputs.tier == 'fast' && matrix.id == 'linux-x64'
        uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          archives: qtbase qtsvg icu
          aqtversion: '==3.3.0'
          install-deps: true
          cache: true
          cache-key-prefix: mint-desktop-qt

      - name: Configure desktop tests
        if: inputs.tier == 'fast' && matrix.id == 'linux-x64'
        shell: bash
        run: |
          cmake --preset dev -B build/gui -DMINT_BUILD_GUI=ON \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build desktop tests
        if: inputs.tier == 'fast' && matrix.id == 'linux-x64'
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          cmake --build build/gui
          --target mint_gui mint_desktop_tests mint_desktop_custom_model_tests
          --parallel ${{ matrix.build_jobs }}

      - name: Test desktop offscreen
        if: inputs.tier == 'fast' && matrix.id == 'linux-x64'
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          ctest --test-dir build/gui --output-on-failure --no-tests=error
          -L desktop --parallel ${{ matrix.build_jobs }}

      - name: Configure release package
        if: inputs.packages
        run: cmake --preset release -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build release package
        if: inputs.packages
        run: cmake --build --preset release --parallel ${{ matrix.build_jobs }}

      - name: Create and verify release package
        if: inputs.packages
        run: |
          cpack --config build/release/CPackConfig.cmake
          cmake -DMINT_BUILD_DIR=build/release -P cmake/VerifyPackage.cmake

      - name: Upload release package
        if: inputs.packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mint-${{ matrix.id }}
          path: build/release/packages/mint-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
