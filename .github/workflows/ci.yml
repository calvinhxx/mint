name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_packages:
        description: Build and upload six Release archives without publishing a release
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-plan:
    name: Build matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      release_packages: ${{ steps.release-mode.outputs.enabled }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate build matrix
        run: |
          python3 .github/scripts/validate-build-matrix.py
          python3 .github/scripts/validate-workflows.py

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python3 scripts/validate-version.py --tag "$GITHUB_REF_NAME"
          git merge-base --is-ancestor \
            "$GITHUB_SHA" \
            "origin/${{ github.event.repository.default_branch }}"

      - name: Select release package mode
        id: release-mode
        shell: bash
        env:
          MINT_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          MINT_MANUAL_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_packages }}
        run: |
          if [[ "$MINT_TAG_RELEASE" == "true" || "$MINT_MANUAL_RELEASE" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Export build matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          echo "matrix=$(jq -c '.matrix' .github/build-matrix.json)" >> "$GITHUB_OUTPUT"

  platform-build:
    name: ${{ matrix.name }}
    needs: build-plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-plan.outputs.matrix) }}
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare native toolchain
        shell: pwsh
        run: |
          if ("${{ runner.arch }}" -ne "${{ matrix.runner_arch }}") {
            throw "Expected runner architecture ${{ matrix.runner_arch }}, got ${{ runner.arch }}"
          }
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not available on this runner"
          }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Activate MSVC
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./.github/scripts/setup-msvc.ps1 -TargetArchitecture "${{ matrix.arch }}"

      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json', 'cmake/triplets/*.cmake', 'cmake/MintPlatformDefaults.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Install platform runtime dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends ${{ join(matrix.system_packages, ' ') }}

      - name: Allow Bubblewrap user namespaces
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          restriction=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -r "$restriction" && "$(<"$restriction")" == "1" ]]; then
            sudo apparmor_parser --replace .github/apparmor/mint-bwrap
          fi

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Verify package layout
        run: |
          cpack --config build/${{ matrix.preset }}/CPackConfig.cmake
          cmake -DMINT_BUILD_DIR=build/${{ matrix.preset }} -P cmake/VerifyPackage.cmake

      - name: Configure release package
        if: needs.build-plan.outputs.release_packages == 'true'
        run: cmake --preset ${{ matrix.release_preset }}

      - name: Build release package
        if: needs.build-plan.outputs.release_packages == 'true'
        run: cmake --build --preset ${{ matrix.release_preset }}

      - name: Create and verify release package
        if: needs.build-plan.outputs.release_packages == 'true'
        run: |
          cpack --config build/${{ matrix.release_preset }}/CPackConfig.cmake
          cmake -DMINT_BUILD_DIR=build/${{ matrix.release_preset }} -P cmake/VerifyPackage.cmake

      - name: Upload release package
        if: needs.build-plan.outputs.release_packages == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mint-${{ matrix.id }}
          path: build/${{ matrix.release_preset }}/packages/mint-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  quality:
    name: macOS ARM64 quality gates
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VCPKG_INSTALLATION_ROOT:-}"
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json', 'cmake/triplets/*.cmake', 'cmake/MintPlatformDefaults.cmake') }}

      - name: Run release checks
        shell: bash
        run: bash scripts/release-check.sh

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [platform-build, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          asset_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          test "$asset_count" -eq 12
          test "$(find release-assets -maxdepth 1 -type f -name '*.sha256' | wc -l | tr -d ' ')" -eq 6

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME is already published; refusing to replace its assets."
              exit 0
            fi
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
