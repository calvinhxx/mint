name: Source validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check committed whitespace
        env:
          MINT_BEFORE_SHA: ${{ github.event.before }}
          MINT_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .github/scripts/check-committed-whitespace.py

      - name: Validate repository metadata
        run: |
          python3 scripts/validate-version.py
          python3 .github/scripts/validate-build-matrix.py
          python3 .github/scripts/validate-workflows.py

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-version.py --tag "$GITHUB_REF_NAME"
          git merge-base --is-ancestor \
            "$GITHUB_SHA" \
            "origin/${{ github.event.repository.default_branch }}"
